<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Psalms & Proverbs">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="The Psalms and Proverbs in today's rendering — read and listen along.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Psalms & Proverbs</title>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       COVER STATE — closed leather-bound book
       ═══════════════════════════════════════════════════════════ -->
  <div id="cover-screen">
    <div id="book-cover" role="button" aria-label="Open the book" tabindex="0">
      <div class="cover-leather">
        <div class="cover-border">
          <div class="cover-icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <path d="M8 10C8 8.9 8.9 8 10 8H22V40H10C8.9 40 8 39.1 8 38V10Z" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.9"/>
              <path d="M40 10C40 8.9 39.1 8 38 8H26V40H38C39.1 40 40 39.1 40 38V10Z" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.9"/>
              <path d="M24 8V40" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
              <path d="M14 16L18 16M14 20L18 20M14 24L18 24M14 28L18 28" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
              <path d="M30 16L34 16M30 20L34 20M30 24L34 24M30 28L34 28" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
            </svg>
          </div>
          <h1 class="cover-title">PSALMS<br>& PROVERBS</h1>
          <p class="cover-subtitle">2026 Rendering</p>
          <div class="cover-divider"></div>
          <p class="cover-tagline">The Psalms and Proverbs in 2026 Rendering</p>
        </div>
      </div>
    </div>
    <p class="tap-hint">Tap to open</p>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       BOOK STATE — open book with page-flip
       ═══════════════════════════════════════════════════════════ -->
  <div id="book-screen" hidden>

    <!-- TOC Overlay (separate from StPageFlip) -->
    <div id="toc-overlay" hidden>
      <div class="toc-overlay-header">
        <span class="toc-overlay-title">Contents</span>
        <button id="toc-close-btn" aria-label="Close contents">✕</button>
      </div>
      <div id="toc-overlay-content"></div>
    </div>

    <!-- Top bar -->
    <div id="top-bar">
      <button id="close-book" aria-label="Close book">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <span id="top-bar-title">Psalms & Proverbs</span>
      <button id="toc-btn" aria-label="Table of Contents" style="background:none;border:none;color:var(--gold);cursor:pointer;padding:4px 8px;font-size:12px;font-family:var(--serif);font-style:italic;letter-spacing:1px;">Contents</button>
      <button id="search-btn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M14 14L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- The book container for StPageFlip -->
    <div id="book-container">
      <div id="book">
        <!-- Pages will be injected by app.js -->
      </div>
    </div>

    <!-- Audio ribbon bookmark -->
    <div id="audio-ribbon" hidden>
      <div class="ribbon-top"></div>
      <div class="ribbon-body">
        <button id="audio-play" aria-label="Play/Pause">
          <svg id="play-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M6 4L16 10L6 16V4Z"/>
          </svg>
          <svg id="pause-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor" hidden>
            <rect x="5" y="4" width="3" height="12" rx="1"/>
            <rect x="12" y="4" width="3" height="12" rx="1"/>
          </svg>
        </button>
        <div class="audio-info">
          <span id="audio-title">Psalm 23</span>
          <div class="audio-seek-row">
            <span id="audio-current">0:00</span>
            <input type="range" id="audio-seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
            <span id="audio-duration">0:00</span>
          </div>
        </div>
        <div class="speed-toggle">
          <button id="speed-btn" data-speed="1">1x</button>
        </div>
      </div>
      <div id="audio-coming-soon" hidden>
        <em>Audio coming soon</em>
      </div>
    </div>

  </div>

  <!-- ═══════════════════════════════════════════════════════════
       SEARCH OVERLAY
       ═══════════════════════════════════════════════════════════ -->
  <div id="search-overlay" hidden>
    <div class="search-header">
      <input type="search" id="search-input" placeholder="Search by number or title…" autocomplete="off" spellcheck="false">
      <button id="search-close" aria-label="Close search">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M4 4L14 14M14 4L4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       LOADING INDICATOR
       ═══════════════════════════════════════════════════════════ -->
  <div id="loading-indicator" hidden>
    <div class="loading-spinner"></div>
    <p>Loading…</p>
  </div>

  <script src="StPageFlip.js"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
